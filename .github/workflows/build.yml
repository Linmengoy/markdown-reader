name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, x64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: .build
        run: npm ci

      - name: 同步页面并生成图标
        working-directory: .build
        run: |
          # app/ 是构建时生成的副本，被 .gitignore 排除，新克隆的仓库里没有这个目录
          mkdir -p app
          cp ../markdown-novel-reader.html app/
          # 用本地安装的 electron，避免 npx 去下载别的版本。
          # 生成失败（无图形环境等）时沿用仓库里已提交的 build/ 图标，不中断构建。
          if ./node_modules/.bin/electron make-icon.js; then
            echo "图标已按 assets/logo.jpg 重新生成"
          else
            git checkout -- build/ 2>/dev/null || true
            echo "::warning::图标生成失败，沿用仓库中已提交的 build/ 图标"
          fi

      - name: 打包 zip
        working-directory: .build
        run: |
          # 只出 zip：解压后就是完整的 .app，功能与 dmg 一致。
          # dmg 在 CI 上不稳——hdiutil detach 常因挂载卷已被系统自动卸载而报
          # "No such file or directory"，属于无头环境的竞态，与卷名无关。
          # 需要 dmg 时在真实 Mac 上跑 build-mac.sh（本地有 GUI，成功率高）。
          ./node_modules/.bin/electron-builder --mac zip --${{ matrix.arch }} --publish never \
            -c.directories.output=../dist-mac

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-reader-mac-${{ matrix.arch }}
          path: |
            dist-mac/*.dmg
            dist-mac/*.zip
          if-no-files-found: warn

  win:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: .build
        run: npm ci

      - name: 打包单文件 exe
        working-directory: .build
        shell: bash
        env:
          # CI 是全新环境，用 builder 内建的 rcedit 写图标/版本更可靠；
          # afterPack 依赖本地 electron-builder 的 winCodeSign 缓存，在 CI 上未必存在
          MDNR_SKIP_AFTERPACK: "1"
        run: |
          mkdir -p app
          cp ../markdown-novel-reader.html app/
          if ! node_modules/.bin/electron make-icon.js; then
            git checkout -- build/ 2>/dev/null || true
            echo "::warning::图标生成失败，沿用仓库中已提交的 build/ 图标"
          fi
          node_modules/.bin/electron-builder --win portable --x64 \
            -c.win.signAndEditExecutable=true \
            -c.directories.output=../dist-win

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: markdown-reader-win
          path: dist-win/*.exe
          if-no-files-found: warn
